<!-- ส่วนแสดงและอัปเดต Stat / HP -->
<div class="stat-container">
    <div class="stat-row">
        <span>STR: <b id="stat-str">0</b></span>
        <button onclick="spendStatPoint('STR')" class="btn-stat">+1</button>
    </div>
    <div class="stat-row">
        <span>DEX: <b id="stat-dex">0</b></span>
        <button onclick="spendStatPoint('DEX')" class="btn-stat">+1</button>
    </div>
    <div class="stat-row">
        <span>INT: <b id="stat-int">0</b></span>
        <button onclick="spendStatPoint('INT')" class="btn-stat">+1</button>
    </div>
    <div class="stat-row">
        <span>CHA: <b id="stat-cha">0</b></span>
        <button onclick="spendStatPoint('CHA')" class="btn-stat">+1</button>
    </div>
    <!-- เพิ่มแถบอัป HP ตรงนี้ -->
    <div class="stat-row hp-stat-row" style="background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; margin-top: 6px; padding: 4px 8px; border-radius: 6px;">
        <span>Max HP (+5):</span>
        <button onclick="spendStatPoint('HP')" class="btn-stat" style="background: #ef4444;">+ HP</button>
    </div>
</div>
